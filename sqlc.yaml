version: "2"
sql:
  - schema: "migrations"
    queries: "internal/database/queries"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/database/sqlc"
        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        json_tags_case_style: "camel"

        overrides:
          # UUID non-null
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

          # UUID nullable (kolom yang boleh NULL)
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "NullUUID"
              import: "github.com/google/uuid"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type: "*time.Time"

          # NUMERIC non-null -> shopspring/decimal
          # - db_type: "pg_catalog.numeric"
          #   go_type: "github.com/shopspring/decimal.Decimal"

          # NUMERIC nullable
          # - db_type: "pg_catalog.numeric"
          #   nullable: true
          #   go_type:
          #     type: "NullDecimal"
          #     import: "github.com/shopspring/decimal"

        rename:
          id: "ID"
          uuid: "UUID"
          url: "URL"
          api: "API"