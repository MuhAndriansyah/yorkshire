RegisterRequest:
  type: object
  required:
    - username
    - email
    - password
  properties:
    username:
      type: string
      minLength: 3
      maxLength: 50
      pattern: "^[a-zA-Z0-9_\\.]+$"
      example: alexplaju
      x-oapi-codegen-extra-tags:
        validate: "required,min=3,max=50"
    email:
      type: string
      format: email
      maxLength: 255
      example: alexplaju@gmail.com
      x-oapi-codegen-extra-tags:
        validate: "required,email,max=255"
    password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      example: StrongPassword123
      x-oapi-codegen-extra-tags:
        validate: "required,min=8,max=72"
  additionalProperties: false

LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      maxLength: 255
      example: alexplaju@gmail.com
      x-oapi-codegen-extra-tags:
        validate: "required,email,max=255"
    password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      example: StrongPassword123
      x-oapi-codegen-extra-tags:
        validate: "required,min=8,max=72"
  additionalProperties: false

AuthUser:
  type: object
  required:
    - id
    - username
    - email
    - avatar_url
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
      example: 0d45a507-7c7e-4bb3-94dd-1f873e0b43f6
    username:
      type: string
      minLength: 3
      maxLength: 50
      example: johndoe
    email:
      type: string
      format: email
      example: john@example.com
    avatar_url:
      type: string
      nullable: true
      example: https://cdn.example.com/avatar.jpg
    created_at:
      type: string
      format: date-time
      example: 2026-06-07T10:00:00Z
    updated_at:
      type: string
      format: date-time
      example: 2026-06-07T10:00:00Z

AuthToken:
  type: object
  required:
    - access_token
    - token_type
    - expires_in
  properties:
    access_token:
      type: string
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    token_type:
      type: string
      example: Bearer
    expires_in:
      type: integer
      description: Access token lifetime in seconds.
      example: 3600

AuthData:
  type: object
  required:
    - user
    - token
  properties:
    user:
      $ref: "#/AuthUser"
    token:
      $ref: "#/AuthToken"

AuthResponse:
  allOf:
    - $ref: ./_common.yaml#/SuccessBase
    - type: object
      required:
        - data
      properties:
        data:
          $ref: "#/AuthData"
